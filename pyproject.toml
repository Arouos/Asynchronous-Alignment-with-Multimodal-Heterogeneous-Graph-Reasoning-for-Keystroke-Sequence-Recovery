[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papercode"
version = "0.1.0"
description = "Reference implementation of AAM-HG for multimodal keystroke sequence recovery."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Haoyu Qiang"}]

[tool.setuptools.packages.find]
where = ["src"]
